<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLyss">
<meta name="theme-color" content="#0d0d0d">
<meta name="color-scheme" content="dark">
<title>FitLyss</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#0d0d0d!important;color:#faf5ee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%;color-scheme:dark;height:100%}
.screen{display:none;flex-direction:column;height:100vh;height:-webkit-fill-available;overflow:hidden}
.screen.active{display:flex}
#home{background:#0d0d0d;flex:1;display:flex;flex-direction:column;overflow:hidden}
.hero{padding:calc(env(safe-area-inset-top,0px) + 48px) 22px 24px;border-bottom:1px solid #2a2a2a;background:#0d0d0d}
.badge{display:inline-block;font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#c9836a;border:1px solid #c9836a;padding:4px 12px;margin-bottom:16px}
.htitle{font-weight:900;font-size:70px;line-height:0.88;letter-spacing:-1px;margin-bottom:6px;color:#faf5ee}
.htitle span{color:#c9836a}
.hsub{font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#555;margin-bottom:22px}
.prow{display:flex;align-items:center;gap:18px}
.rwrap{position:relative;width:78px;height:78px;flex-shrink:0}
.rwrap svg{transform:rotate(-90deg)}
.rcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rpct{font-weight:900;font-size:19px;color:#c9836a;line-height:1}
.rlbl{font-size:9px;color:#555;letter-spacing:1px;font-family:'Courier New',monospace;text-transform:uppercase}
.pmeta{flex:1}
.pline{display:flex;justify-content:space-between;margin-bottom:7px;align-items:baseline}
.pkey{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555}
.pval{font-weight:900;font-size:21px;color:#c9836a}
.ptabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:14px 14px 0;gap:6px;background:#0d0d0d}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:8px 13px;border:1px solid #2a2a2a;border-bottom:none;background:transparent;color:#555;cursor:pointer;border-radius:4px 4px 0 0}
.ptab.active{background:#1a1a1a;border-color:#c9836a;color:#c9836a}
.pcontent{padding:0 14px 16px;background:#1a1a1a;min-height:300px}
.wkhdr{font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#c9836a;padding:14px 0 8px;border-bottom:1px solid #2a2a2a;margin-bottom:8px}
.drow{display:flex;align-items:center;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;margin-bottom:8px;cursor:pointer;user-select:none}
.drow.done{border-color:#7dba84}
.drow:active{opacity:0.7}
.dchk{width:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dcirc{width:22px;height:22px;border-radius:50%;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.drow.done .dcirc{background:#7dba84;border-color:#7dba84;color:#fff}
.drow.done .dnum{color:#7dba84}
.dinf{flex:1;padding:11px 8px 11px 0;min-width:0}
.dnum{font-family:'Courier New',monospace;font-size:10px;color:#c9836a;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
.dtit{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#faf5ee}
.dsub{font-size:11px;color:#555;margin-top:2px;font-family:'Courier New',monospace}
.darr{padding:0 12px;color:#333;font-size:18px;flex-shrink:0}
/* DETAIL */
#detail{background:#0d0d0d;display:none;flex-direction:column;height:100vh;height:-webkit-fill-available;overflow:hidden}
#detail.active{display:flex}
.dhdr{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:10px;background:#0d0d0d;flex-shrink:0;position:sticky;top:0;z-index:10}
.bbtn{font-family:'Courier New',monospace;font-size:11px;letter-spacing:1px;color:#c9836a;background:none;border:none;cursor:pointer;padding:8px 0;text-transform:uppercase;white-space:nowrap}
.ddnum{font-weight:900;font-size:30px;color:#c9836a;line-height:1;flex-shrink:0}
.ddcol{flex:1;min-width:0}
.ddtit{font-weight:700;font-size:14px;color:#faf5ee}
.ddph{font-family:'Courier New',monospace;font-size:10px;color:#555;letter-spacing:1px;margin-top:2px;text-transform:uppercase}
.stabs{display:flex;background:#0d0d0d;border-bottom:1px solid #2a2a2a;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stab{flex:1;min-width:60px;font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:11px 4px;background:transparent;border:none;color:#555;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.stab.active{color:#c9836a;border-bottom-color:#c9836a}
.tpanel{display:none;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.tpanel.active{display:block}
/* shared detail components */
.donebanner{background:rgba(125,186,132,0.1);border:1px solid #7dba84;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#7dba84;font-weight:600}
.seclbl{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #1e1e1e}
.secblk{margin-bottom:18px}
.exitem{background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;margin-bottom:6px}
.exrow{display:flex;justify-content:space-between;align-items:center}
.exn{font-size:13px;color:#faf5ee;font-weight:500}
.exd{font-family:'Courier New',monospace;font-size:11px;color:#c9836a;flex-shrink:0;margin-left:6px;text-align:right}
.vidlink{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-family:'Courier New',monospace;font-size:10px;color:#c9836a;text-decoration:none;letter-spacing:1px;padding:3px 8px;border:1px solid rgba(201,131,106,0.3);border-radius:3px}
.tipbox{background:#141414;border-left:3px solid #c9836a;border-radius:0 6px 6px 0;padding:11px 14px;margin-bottom:14px}
.tiptit{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a;margin-bottom:8px}
.tipitem{font-size:12px;color:#aaa;padding:3px 0 3px 14px;position:relative;line-height:1.4}
.tipitem::before{content:'->'; position:absolute;left:0;color:#c9836a;font-family:'Courier New',monospace}
/* checklist */
.hcl{margin-bottom:18px}
.hcltit{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a;margin-bottom:8px}
.hclitem{display:flex;align-items:center;gap:10px;background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:11px 13px;margin-bottom:6px;cursor:pointer;user-select:none}
.hclitem:active{opacity:0.7}
.hclitem.chk{border-color:#7dba84}
.hclitem.chk .hclbox{background:#7dba84;border-color:#7dba84;color:#fff}
.hclbox{width:20px;height:20px;border-radius:4px;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:transparent}
.hcltxt{font-size:13px;color:#faf5ee;line-height:1.3}
/* meals */
.mcard{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:13px;margin-bottom:10px}
.mtime{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a;margin-bottom:5px}
.mname{font-size:14px;font-weight:600;color:#faf5ee;margin-bottom:4px}
.mdesc{font-size:12px;color:#777;line-height:1.5}
.mmacs{display:flex;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid #2a2a2a}
.mac{text-align:center}
.macv{font-weight:700;font-size:14px;color:#faf5ee}
.macl{font-family:'Courier New',monospace;font-size:9px;color:#555;letter-spacing:1px;text-transform:uppercase}
.mtotal{background:rgba(201,131,106,0.08);border:1px solid rgba(201,131,106,0.2);border-radius:6px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mtotlbl{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a}
.mtotvals{display:flex;gap:14px}
/* photo */
.photoarea{background:#141414;border:2px dashed #2a2a2a;border-radius:12px;padding:30px 18px;text-align:center;margin-bottom:14px;cursor:pointer}
.photoicon{font-size:38px;margin-bottom:8px}
.photolbl{font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:4px}
.photosub{font-size:12px;color:#333}
.photoprev{width:100%;border-radius:10px;margin-bottom:12px;display:block;object-fit:cover;max-height:320px}
.noteinput{width:100%;background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;color:#faf5ee;font-size:13px;font-family:-apple-system,sans-serif;resize:none;margin-bottom:10px;outline:none}
.noteinput:focus{border-color:#c9836a}
.photobtn{width:100%;padding:12px;background:transparent;color:#c9836a;border:1px solid #c9836a;border-radius:8px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-bottom:8px}
.photodlbl{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a;margin-bottom:8px;margin-top:14px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gallitem{position:relative;border-radius:8px;overflow:hidden;background:#141414;border:1px solid #2a2a2a}
.gallitem img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.galllbl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.8));padding:5px 7px;font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;color:#c9836a;text-transform:uppercase}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cslot{background:#141414;border:1px solid #2a2a2a;border-radius:8px;overflow:hidden}
.cslot img{width:100%;aspect-ratio:0.75;object-fit:cover;display:block}
.cslotlbl{padding:6px;font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;color:#555;text-transform:uppercase;text-align:center}
.gallempty{text-align:center;padding:30px;color:#333;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase}
/* complete btn */
.cbtn{display:flex;align-items:center;justify-content:center;width:100%;padding:15px;background:#c9836a;color:#0d0d0d;border:none;border-radius:8px;font-weight:900;font-size:18px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:8px}
.cbtn:active{opacity:0.8}
.cbtn.done{background:#1a2e1c;color:#7dba84}
/* shopping */
#shopping{background:#0d0d0d;flex:1;display:flex;flex-direction:column;overflow:hidden}
.shpad{padding:calc(env(safe-area-inset-top,0px) + 48px) 18px 100px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.shtit{font-weight:900;font-size:38px;letter-spacing:-1px;margin-bottom:4px;color:#faf5ee}
.shsub{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:20px}
.wksel{display:flex;overflow-x:auto;scrollbar-width:none;gap:7px;margin-bottom:18px}
.wksel::-webkit-scrollbar{display:none}
.wkpill{flex-shrink:0;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;border:1px solid #2a2a2a;border-radius:20px;background:transparent;color:#555;cursor:pointer}
.wkpill.active{background:rgba(201,131,106,0.1);border-color:#c9836a;color:#c9836a}
.shcat{margin-bottom:18px}
.shcattit{font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#c9836a;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #2a2a2a}
.shitem{display:flex;align-items:center;gap:10px;background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:10px 13px;margin-bottom:6px;cursor:pointer;user-select:none}
.shitem:active{opacity:0.7}
.shitem.got{opacity:0.4}
.shitem.got .shchk{background:#7dba84;border-color:#7dba84;color:#fff}
.shchk{width:20px;height:20px;border-radius:4px;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:transparent}
.shname{font-size:13px;color:#faf5ee;flex:1}
.shqty{font-family:'Courier New',monospace;font-size:11px;color:#555;flex-shrink:0}
.shreset{width:100%;padding:11px;background:transparent;color:#444;border:1px solid #2a2a2a;border-radius:8px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:6px}
/* stats */
#stats{background:#0d0d0d;flex:1;display:flex;flex-direction:column;overflow:hidden}
.stpad{padding:calc(env(safe-area-inset-top,0px) + 48px) 18px 100px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sttit{font-weight:900;font-size:38px;letter-spacing:-1px;margin-bottom:20px;border-bottom:1px solid #2a2a2a;padding-bottom:14px;color:#faf5ee}
.stcard{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:18px;margin-bottom:12px}
.stclbl{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:7px}
.stcval{font-weight:900;font-size:42px;color:#c9836a;line-height:1}
.stcsub{font-size:12px;color:#555;margin-top:4px}
.calgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:10px}
.calcell{aspect-ratio:1;border-radius:2px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;font-size:7px;color:#444}
.calcell.done{background:#7dba84;color:#fff}
/* bottom nav */
.bnav{display:flex;background:#141414;border-top:1px solid #2a2a2a;padding:7px 0 calc(env(safe-area-inset-bottom,0px) + 7px);flex-shrink:0;position:sticky;bottom:0;z-index:10}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:#444;cursor:pointer;padding:5px 0;font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase}
.nbtn.active{color:#c9836a}
.nicon{font-size:19px}
/* toast */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 75px);left:50%;transform:translateX(-50%) translateY(20px);background:#7dba84;color:#fff;padding:9px 18px;border-radius:18px;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;opacity:0;pointer-events:none;z-index:999;white-space:nowrap;transition:all 0.25s;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="screen active" id="home">
  <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0d0d0d;display:flex;flex-direction:column">
    <div class="hero">
      <div class="badge">90-Day Sculpt Protocol</div>
      <div class="htitle">SCULPT<br><span>&amp;</span><br>DEFINE</div>
      <div class="hsub">Glutes - Abs - Total Body Definition</div>
      <div class="prow">
        <div class="rwrap">
          <svg width="78" height="78" viewBox="0 0 78 78">
            <circle cx="39" cy="39" r="33" fill="none" stroke="#2a2a2a" stroke-width="7"/>
            <circle id="ringCircle" cx="39" cy="39" r="33" fill="none" stroke="#c9836a" stroke-width="7" stroke-dasharray="207.3" stroke-dashoffset="207.3" stroke-linecap="round"/>
          </svg>
          <div class="rcenter"><div class="rpct" id="ringPct">0%</div><div class="rlbl">done</div></div>
        </div>
        <div class="pmeta">
          <div class="pline"><span class="pkey">Completed</span><span class="pval" id="doneCount">0/90</span></div>
          <div class="pline"><span class="pkey">Streak</span><span class="pval" id="streakCount">0</span></div>
          <div class="pline"><span class="pkey">Phase</span><span class="pval" id="curPhase">RAMP</span></div>
        </div>
      </div>
    </div>
    <div class="ptabs" id="phaseTabs">
      <button class="ptab active" onclick="switchPhase(0)">Phase 1 Ramp</button>
      <button class="ptab" onclick="switchPhase(1)">Phase 2A Hard</button>
      <button class="ptab" onclick="switchPhase(2)">Phase 2B Hard</button>
    </div>
    <div class="pcontent" id="phaseContent"></div>
  </div>
  <div class="bnav">
    <button class="nbtn active" onclick="showScreen('home',this)"><span class="nicon">&#127800;</span>Plan</button>
    <button class="nbtn" onclick="showScreen('shopping',this)"><span class="nicon">&#128722;</span>Shop</button>
    <button class="nbtn" onclick="showScreen('stats',this)"><span class="nicon">&#128202;</span>Stats</button>
  </div>
</div>

<div class="screen" id="detail">
  <div class="dhdr">
    <button class="bbtn" onclick="goBack()">Back</button>
    <div class="ddnum" id="ddnum">D1</div>
    <div class="ddcol"><div class="ddtit" id="ddtit"></div><div class="ddph" id="ddph"></div></div>
  </div>
  <div class="stabs">
    <button class="stab active" onclick="openTab('workout',this)">Workout</button>
    <button class="stab" onclick="openTab('meal',this)">Meals</button>
    <button class="stab" onclick="openTab('checkin',this)">Check-In</button>
    <button class="stab" onclick="openTab('photo',this)">Photo</button>
  </div>
  <div id="tp-workout" class="tpanel active"></div>
  <div id="tp-meal" class="tpanel"></div>
  <div id="tp-checkin" class="tpanel"></div>
  <div id="tp-photo" class="tpanel"></div>
</div>

<div class="screen" id="shopping">
  <div class="shpad">
    <div class="shtit">Shopping</div>
    <div class="shsub">Weekly grocery list</div>
    <div class="wksel" id="wksel"></div>
    <div id="shcontent"></div>
  </div>
  <div class="bnav">
    <button class="nbtn" onclick="showScreen('home',this)"><span class="nicon">&#127800;</span>Plan</button>
    <button class="nbtn active" onclick="showScreen('shopping',this)"><span class="nicon">&#128722;</span>Shop</button>
    <button class="nbtn" onclick="showScreen('stats',this)"><span class="nicon">&#128202;</span>Stats</button>
  </div>
</div>

<div class="screen" id="stats">
  <div class="stpad">
    <div class="sttit">Progress</div>
    <div id="stcontent"></div>
  </div>
  <div class="bnav">
    <button class="nbtn" onclick="showScreen('home',this)"><span class="nicon">&#127800;</span>Plan</button>
    <button class="nbtn" onclick="showScreen('shopping',this)"><span class="nicon">&#128722;</span>Shop</button>
    <button class="nbtn active" onclick="showScreen('stats',this)"><span class="nicon">&#128202;</span>Stats</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var done = {}, checks = {}, photos = {}, shopChk = {};
var curPhaseIdx = 0, curDayIdx = 0, prevScr = 'home', curShopWk = 0;

function loadData() {
  try { done = JSON.parse(localStorage.getItem('fl_done') || '{}'); } catch(e) { done = {}; }
  try { checks = JSON.parse(localStorage.getItem('fl_chk') || '{}'); } catch(e) { checks = {}; }
  try { photos = JSON.parse(localStorage.getItem('fl_photos') || '{}'); } catch(e) { photos = {}; }
  try { shopChk = JSON.parse(localStorage.getItem('fl_shop') || '{}'); } catch(e) { shopChk = {}; }
}
function saveData() {
  try { localStorage.setItem('fl_done', JSON.stringify(done)); } catch(e) {}
  try { localStorage.setItem('fl_chk', JSON.stringify(checks)); } catch(e) {}
  try { localStorage.setItem('fl_shop', JSON.stringify(shopChk)); } catch(e) {}
}
function savePhotos() {
  try { localStorage.setItem('fl_photos', JSON.stringify(photos)); } catch(e) {}
}

var VIDS = {
  'Hip Thrust': 'https://www.youtube.com/watch?v=xDmFkJxPzeM',
  'Romanian Deadlift': 'https://www.youtube.com/watch?v=hCDzSR6bW10',
  'Bulgarian Split Squat': 'https://www.youtube.com/watch?v=2C-uNgKwPLE',
  'Barbell Back Squat': 'https://www.youtube.com/watch?v=bEv6CCg2BC8',
  'Cable Kickback': 'https://www.youtube.com/watch?v=xdCyGalAcQQ',
  'Sumo Deadlift': 'https://www.youtube.com/watch?v=XB_CFxoXZIE',
  'Good Morning': 'https://www.youtube.com/watch?v=YA-h3n9L4YU',

// ── RENDER PHASE LIST ──────────────────────────────────────────
function switchPhase(idx) {
  curPhaseIdx = idx;
  var tabs = document.querySelectorAll('.ptab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', i === idx);
  }
  renderList(idx);
}

function renderList(idx) {
  var content = document.getElementById('phaseContent');
  if (!content) return;
  content.innerHTML = '';
  var days, weeks;
  if (idx === 0) {
    days = P1;
    weeks = [{l:'Week 1 - Days 1-7',s:0,e:7},{l:'Week 2 - Days 8-15',s:7,e:15}];
  } else if (idx === 1) {
    days = P2A;
    weeks = [{l:'Days 16-22',s:0,e:7},{l:'Days 23-29',s:7,e:14},{l:'Days 30-36',s:14,e:21},{l:'Days 37-45',s:21,e:30}];
  } else {
    days = P2B;
    weeks = [{l:'Days 46-52',s:0,e:7},{l:'Days 53-59',s:7,e:14},{l:'Days 60-66',s:14,e:21},{l:'Days 67-73',s:21,e:28},{l:'Days 74-82',s:28,e:37},{l:'Days 83-90 FINAL PUSH',s:37,e:45}];
  }
  for (var wi = 0; wi < weeks.length; wi++) {
    var wk = weeks[wi];
    var wh = document.createElement('div');
    wh.className = 'wkhdr';
    wh.textContent = wk.l;
    content.appendChild(wh);
    var slice = days.slice(wk.s, wk.e);
    for (var di = 0; di < slice.length; di++) {
      (function(d) {
        var gi = 0;
        for (var k = 0; k < ALL_DAYS.length; k++) { if (ALL_DAYS[k].day === d.day) { gi = k; break; } }
        var isDone = !!done[d.day];
        var row = document.createElement('div');
        row.className = 'drow' + (isDone ? ' done' : '');
        row.innerHTML = '<div class="dchk"><div class="dcirc">' + (isDone ? '&#10003;' : '') + '</div></div>' +
          '<div class="dinf">' +
          '<div class="dnum">DAY ' + d.day + '</div>' +
          '<div class="dtit">' + d.title + '</div>' +
          '<div class="dsub">' + (d.focus || '') + (d.outdoor ? ' - Outdoor' : '') + '</div>' +
          '</div>' +
          '<div class="darr">&#8250;</div>';
        row.onclick = function() { openDay(gi); };
        content.appendChild(row);
      })(slice[di]);
    }
  }
}

// ── OPEN DAY ──────────────────────────────────────────────────
function openDay(gi) {
  curDayIdx = gi;
  var d = ALL_DAYS[gi];
  document.getElementById('ddnum').textContent = 'D' + d.day;
  document.getElementById('ddtit').textContent = d.title;
  document.getElementById('ddph').textContent = d.day < 16 ? 'RAMP PHASE' : (d.day < 46 ? '75 HARD 2A' : '75 HARD 2B');
  var stabs = document.querySelectorAll('.stab');
  var tpanels = document.querySelectorAll('.tpanel');
  for (var i = 0; i < stabs.length; i++) stabs[i].classList.toggle('active', i === 0);
  for (var i = 0; i < tpanels.length; i++) tpanels[i].classList.toggle('active', i === 0);
  buildWorkoutPanel(d);
  buildMealPanel(d.day);
  buildCheckinPanel(d);
  buildPhotoPanel(d);
  showScreen('detail', null);
}

function openTab(name, btn) {
  var stabs = document.querySelectorAll('.stab');
  var tpanels = document.querySelectorAll('.tpanel');
  for (var i = 0; i < stabs.length; i++) stabs[i].classList.remove('active');
  for (var i = 0; i < tpanels.length; i++) tpanels[i].classList.remove('active');
  btn.classList.add('active');
  document.getElementById('tp-' + name).classList.add('active');
}

// ── WORKOUT PANEL ─────────────────────────────────────────────
function buildWorkoutPanel(d) {
  var p = document.getElementById('tp-workout');
  var isDone = !!done[d.day];
  var html = '';
  if (isDone) html += '<div class="donebanner">Day ' + d.day + ' complete! You are crushing it.</div>';
  if (d.day >= 16 && d.outdoorDesc) {
    html += '<div class="secblk"><div class="seclbl">Workout 2 - Outdoors</div><div class="exitem"><div class="exrow"><span class="exn">' + d.outdoorDesc + '</span></div></div></div>';
  }
  if (d.day < 16) {
    html += '<div class="tipbox"><div class="tiptit">Phase 1 Guidelines</div>' +
      '<div class="tipitem">1 workout today 45-60 minutes</div>' +
      '<div class="tipitem">Focus on form not load - learn the movements</div>' +
      '<div class="tipitem">Drink 80+ oz water today</div>' +
      '<div class="tipitem">Follow meal plan 1800-2000 cal 130g+ protein</div></div>';
  }
  for (var si = 0; si < d.sections.length; si++) {
    var sec = d.sections[si];
    html += '<div class="secblk"><div class="seclbl">' + sec.lbl + '</div>';
    for (var ei = 0; ei < sec.ex.length; ei++) {
      var ex = sec.ex[ei];
      html += '<div class="exitem"><div class="exrow"><span class="exn">' + ex.n + '</span><span class="exd">' + ex.d + '</span></div>';
      if (ex.v) html += '<a href="' + ex.v + '" target="_blank" class="vidlink">&#9654; Watch Tutorial</a>';
      html += '</div>';
    }
    html += '</div>';
  }
  html += '<button class="cbtn' + (isDone ? ' done' : '') + '" id="cbtn1" onclick="toggleDone(' + d.day + ')">' + (isDone ? 'DAY COMPLETE' : 'MARK DAY COMPLETE') + '</button>';
  html += '<div style="height:40px"></div>';
  p.innerHTML = html;
}

// ── CHECKIN PANEL ─────────────────────────────────────────────
function buildCheckinPanel(d) {
  var p = document.getElementById('tp-checkin');
  var isDone = !!done[d.day];
  var isHard = d.day >= 16;
  var items = isHard ? HARD_ITEMS : P1_ITEMS;
  var ck = checks['d' + d.day] || {};
  var html = '';
  if (isDone) html += '<div class="donebanner">Day ' + d.day + ' complete!</div>';
  html += '<div class="hcl"><div class="hcltit">' + (isHard ? '75 Hard Daily Checklist' : 'Phase 1 Daily Check-In') + '</div>';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var isChk = !!ck[item.k];
    html += '<div class="hclitem' + (isChk ? ' chk' : '') + '" onclick="toggleCheck(' + d.day + ',\'' + item.k + '\',this)">';
    html += '<div class="hclbox">' + (isChk ? '&#10003;' : '') + '</div>';
    html += '<div class="hcltxt">' + item.lbl + '</div></div>';
  }
  html += '</div>';
  html += '<button class="cbtn' + (isDone ? ' done' : '') + '" id="cbtn2" onclick="toggleDone(' + d.day + ')">' + (isDone ? 'DAY COMPLETE' : 'MARK DAY COMPLETE') + '</button>';
  html += '<div style="height:40px"></div>';
  p.innerHTML = html;
}

function handleUpload(day, input) {
var file = input.files[0]; if (!file) return;
var reader = new FileReader();
reader.onload = function(e) {
var note = document.getElementById(‘pnote’) ? document.getElementById(‘pnote’).value : ‘’;
photos[‘day’ + day] = {src: e.target.result, note: note, date: new Date().toLocaleDateString()};
savePhotos();
buildPhotoPanel(ALL_DAYS[curDayIdx]);
showToast(‘Photo saved!’);
};
reader.readAsDataURL(file);
}
function saveNote(day) {
var note = document.getElementById(‘pnote’) ? document.getElementById(‘pnote’).value : ‘’;
if (!photos[‘day’ + day]) photos[‘day’ + day] = {};
photos[‘day’ + day].note = note;
savePhotos();
showToast(‘Note saved!’);
}
function deletePhoto(day) {
delete photos[‘day’ + day];
savePhotos();
buildPhotoPanel(ALL_DAYS[curDayIdx]);
showToast(‘Photo removed.’);
}

// ── CHECKIN TOGGLE ────────────────────────────────────────────
function toggleCheck(day, key, el) {
var dk = ‘d’ + day;
if (!checks[dk]) checks[dk] = {};
checks[dk][key] = !checks[dk][key];
saveData();
el.classList.toggle(‘chk’, checks[dk][key]);
el.querySelector(’.hclbox’).innerHTML = checks[dk][key] ? ‘✓’ : ‘’;
var items = day >= 16 ? HARD_ITEMS : P1_ITEMS;
var allChk = true;
for (var i = 0; i < items.length; i++) { if (!checks[dk][items[i].k]) { allChk = false; break; } }
if (allChk && !done[day]) {
done[day] = true; saveData();
updateBtns(day, true);
showToast(‘All tasks done - Day ’ + day + ’ complete!’);
updateProgress();
}
}

function toggleDone(day) {
done[day] = !done[day]; saveData();
updateBtns(day, done[day]);
if (done[day]) showToast(‘Day ’ + day + ’ marked complete!’);
updateProgress();
}

function updateBtns(day, isDone) {
var btns = [‘cbtn1’,‘cbtn2’];
for (var i = 0; i < btns.length; i++) {
var b = document.getElementById(btns[i]);
if (b) { b.textContent = isDone ? ‘DAY COMPLETE’ : ‘MARK DAY COMPLETE’; b.classList.toggle(‘done’, isDone); }
}
// Update banner
var panels = document.querySelectorAll(’.tpanel’);
for (var i = 0; i < panels.length; i++) {
var ex = panels[i].querySelector(’.donebanner’);
if (isDone && !ex) panels[i].insertAdjacentHTML(‘afterbegin’, ‘<div class="donebanner">Day ’ + day + ’ complete! You are crushing it.</div>’);
else if (!isDone && ex) ex.remove();
}
}

// ── PROGRESS ──────────────────────────────────────────────────
function updateProgress() {
var count = 0;
for (var k in done) { if (done[k]) count++; }
var pct = Math.round((count / 90) * 100);
var el = document.getElementById(‘doneCount’); if (el) el.textContent = count + ‘/90’;
var el2 = document.getElementById(‘ringPct’); if (el2) el2.textContent = pct + ‘%’;
var ring = document.getElementById(‘ringCircle’);
if (ring) ring.style.strokeDashoffset = 207.3 - (pct / 100) * 207.3;
var streak = 0;
for (var i = 1; i <= 90; i++) { if (done[i]) streak++; else break; }
var el3 = document.getElementById(‘streakCount’); if (el3) el3.textContent = streak + ’ streak’;
var el4 = document.getElementById(‘curPhase’);
if (el4) el4.textContent = count < 15 ? ‘RAMP’ : count < 45 ? ‘2A HARD’ : ‘2B HARD’;
renderStats(count, streak, pct);
}

function renderStats(count, streak, pct) {
var sc = document.getElementById(‘stcontent’); if (!sc) return;
var html = ‘<div class="stcard"><div class="stclbl">Days Completed</div><div class="stcval">’ + count + ‘</div><div class="stcsub">’ + (90-count) + ’ days remaining</div></div>’;
html += ‘<div class="stcard"><div class="stclbl">Streak</div><div class="stcval">’ + streak + ‘</div><div class="stcsub">Consecutive days from Day 1</div></div>’;
html += ‘<div class="stcard"><div class="stclbl">Completion</div><div class="stcval">’ + pct + ‘%</div><div style="background:#2a2a2a;border-radius:4px;height:6px;margin-top:10px;overflow:hidden"><div style="background:#c9836a;height:6px;width:' + pct + '%;border-radius:4px"></div></div></div>’;
html += ‘<div class="stcard"><div class="stclbl">Goal</div><div class="stcval" style="font-size:22px;line-height:1.5">Glutes<br>Abs<br>Definition</div><div class="stcsub" style="margin-top:6px">130g+ protein per day - 1800-2000 cal</div></div>’;
html += ‘<div class="stcard"><div class="stclbl">90-Day Grid</div><div class="calgrid" id="calgrid"></div></div>’;
sc.innerHTML = html;
var grid = document.getElementById(‘calgrid’);
if (grid) {
for (var i = 1; i <= 90; i++) {
var cell = document.createElement(‘div’);
cell.className = ‘calcell’ + (done[i] ? ’ done’ : ‘’);
cell.textContent = i;
grid.appendChild(cell);
}
}
}

// ── SHOPPING ──────────────────────────────────────────────────
function renderShopping(wkIdx) {
curShopWk = wkIdx;
var sel = document.getElementById(‘wksel’); if (!sel) return;
sel.innerHTML = ‘’;
for (var i = 0; i < ALL_SHOP.length; i++) {
(function(idx) {
var btn = document.createElement(‘button’);
btn.className = ‘wkpill’ + (idx === wkIdx ? ’ active’ : ‘’);
btn.textContent = ALL_SHOP[idx].wk;
btn.onclick = function() {
var pills = document.querySelectorAll(’.wkpill’);
for (var j = 0; j < pills.length; j++) pills[j].classList.remove(‘active’);
btn.classList.add(‘active’);
renderShopList(idx);
};
sel.appendChild(btn);
})(i);
}
renderShopList(wkIdx);
}

function renderShopList(wkIdx) {
var content = document.getElementById(‘shcontent’); if (!content) return;
var wk = ALL_SHOP[wkIdx];
var wkKey = ‘w’ + wkIdx;
var ck = shopChk[wkKey] || {};
var html = ‘<div style="font-family:Courier New,monospace;font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-bottom:14px">’ + wk.days + ‘</div>’;
for (var ci = 0; ci < wk.cats.length; ci++) {
var cat = wk.cats[ci];
html += ‘<div class="shcat"><div class="shcattit">’ + cat.cat + ‘</div>’;
for (var ii = 0; ii < cat.items.length; ii++) {
var item = cat.items[ii];
var key = ci + ‘_’ + ii;
var got = !!ck[key];
html += ‘<div class="shitem' + (got ? ' got' : '') + '" onclick="toggleShop(' + wkIdx + ',' + ci + ',' + ii + ',this)">’;
html += ‘<div class="shchk">’ + (got ? ‘✓’ : ‘’) + ‘</div>’;
html += ‘<span class="shname">’ + item[0] + ‘</span><span class="shqty">’ + item[1] + ‘</span></div>’;
}
html += ‘</div>’;
}
var total = 0;
for (var ci = 0; ci < wk.cats.length; ci++) total += wk.cats[ci].items.length;
var gotCount = 0;
for (var k in ck) { if (ck[k]) gotCount++; }
html += ‘<div style="font-family:Courier New,monospace;font-size:11px;color:#555;letter-spacing:2px;text-align:center;margin:14px 0">’ + gotCount + ’ / ’ + total + ’ items checked</div>’;
html += ‘<button class="shreset" onclick="resetShop(' + wkIdx + ')">Reset This Week</button>’;
html += ‘<div style="height:40px"></div>’;
content.innerHTML = html;
}

function toggleShop(wkIdx, ci, ii, el) {
var wkKey = ‘w’ + wkIdx, key = ci + ‘_’ + ii;
if (!shopChk[wkKey]) shopChk[wkKey] = {};
shopChk[wkKey][key] = !shopChk[wkKey][key];
saveData();
var got = shopChk[wkKey][key];
el.classList.toggle(‘got’, got);
el.querySelector(’.shchk’).innerHTML = got ? ‘✓’ : ‘’;
}

function resetShop(wkIdx) {
shopChk[‘w’ + wkIdx] = {};
saveData();
renderShopList(wkIdx);
showToast(‘List reset.’);
}

// ── NAVIGATION ────────────────────────────────────────────────
function showScreen(id, btn) {
if (id !== ‘detail’) prevScr = id;
var screens = document.querySelectorAll(’.screen’);
for (var i = 0; i < screens.length; i++) screens[i].classList.remove(‘active’);
document.getElementById(id).classList.add(‘active’);
if (btn) {
var nbtns = document.querySelectorAll(’.nbtn’);
for (var i = 0; i < nbtns.length; i++) nbtns[i].classList.remove(‘active’);
btn.classList.add(‘active’);
}
if (id === ‘stats’) updateProgress();
if (id === ‘shopping’) renderShopping(curShopWk);
}

function goBack() {
showScreen(prevScr, null);
renderList(curPhaseIdx);
updateProgress();
}

function showToast(msg) {
var t = document.getElementById(‘toast’);
t.textContent = msg; t.classList.add(‘show’);
setTimeout(function() { t.classList.remove(‘show’); }, 2400);
}

// ── INIT ──────────────────────────────────────────────────────
loadData();
renderList(0);
updateProgress();
</script>
