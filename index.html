<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shape90">
<meta name="theme-color" content="#0d0d0d">
<meta name="color-scheme" content="dark">
<title>Shape90</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0d0d0d;color-scheme:dark}
body{background:#0d0d0d!important;color:#faf5ee;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;min-height:100vh;overscroll-behavior:none;-webkit-text-size-adjust:100%}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}
#home{background:#0d0d0d;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.home-hero{padding:calc(env(safe-area-inset-top,0px)+52px) 24px 28px;border-bottom:1px solid #2a2a2a;position:relative;overflow:hidden;background:linear-gradient(160deg,#0d0d0d 60%,#1a0d0a)}
.home-hero::after{content:'90';position:absolute;right:-8px;top:-8px;font-weight:900;font-size:190px;color:rgba(201,131,106,0.05);line-height:1;pointer-events:none;user-select:none}
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#c9836a;border:1px solid rgba(201,131,106,0.4);padding:4px 12px;margin-bottom:18px;font-family:'Courier New',monospace}
.hero-title{font-weight:900;font-size:72px;line-height:0.88;letter-spacing:-1px;margin-bottom:6px;color:#faf5ee}
.hero-title span{color:#c9836a}
.hero-sub{font-size:10px;color:#555;letter-spacing:3px;text-transform:uppercase;font-family:'Courier New',monospace;margin-bottom:24px}
.progress-row{display:flex;align-items:center;gap:20px}
.ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-weight:900;font-size:20px;color:#c9836a;line-height:1}
.ring-lbl{font-size:9px;color:#555;letter-spacing:1px;text-transform:uppercase;font-family:'Courier New',monospace}
.progress-meta{flex:1}
.prog-line{display:flex;justify-content:space-between;margin-bottom:8px;align-items:baseline}
.prog-key{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555}
.prog-val{font-weight:900;font-size:22px;color:#c9836a}
.phase-tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:16px 16px 0;gap:6px;background:#0d0d0d}
.phase-tabs::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:8px 14px;border:1px solid #2a2a2a;border-bottom:none;background:transparent;color:#555;cursor:pointer;border-radius:4px 4px 0 0;transition:all 0.15s}
.ptab.active{background:#1a1a1a;border-color:#c9836a;color:#c9836a}
.phase-content{padding:0 16px 16px;background:#1a1a1a;min-height:200px}
.week-header{font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#c9836a;padding:16px 0 10px;border-bottom:1px solid #2a2a2a;margin-bottom:10px}
.day-row{display:flex;align-items:center;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:border-color 0.15s;user-select:none}
.day-row:active{opacity:0.75}
.day-row.done{border-color:#7dba84}
.check-col{width:44px;display:flex;align-items:center;justify-content:center;padding:14px 0;flex-shrink:0}
.check-circle{width:22px;height:22px;border-radius:50%;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all 0.2s}
.day-row.done .check-circle{background:#7dba84;border-color:#7dba84;color:#fff}
.day-info{flex:1;padding:12px 8px 12px 0;min-width:0}
.day-num{font-family:'Courier New',monospace;font-size:10px;color:#c9836a;letter-spacing:2px;line-height:1;margin-bottom:3px;text-transform:uppercase}
.day-row.done .day-num{color:#7dba84}
.day-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#faf5ee}
.day-sub{font-size:11px;color:#555;margin-top:2px;font-family:'Courier New',monospace}
.arrow-col{padding:0 12px;color:#333;font-size:18px;flex-shrink:0}
/* DETAIL */
#detail{background:#0d0d0d;display:none;flex-direction:column;min-height:100vh}
#detail.active{display:flex}
.detail-header{padding:calc(env(safe-area-inset-top,0px)+12px) 16px 12px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:12px;flex-shrink:0;background:#0d0d0d;position:sticky;top:0;z-index:10}
.back-btn{font-family:'Courier New',monospace;font-size:11px;letter-spacing:1px;color:#c9836a;background:none;border:none;cursor:pointer;padding:8px 0;text-transform:uppercase}
.detail-day-num{font-weight:900;font-size:32px;color:#c9836a;line-height:1}
.detail-title-col{flex:1;min-width:0}
.detail-title{font-weight:700;font-size:15px;color:#faf5ee}
.detail-phase-lbl{font-family:'Courier New',monospace;font-size:10px;color:#555;letter-spacing:1px;margin-top:2px;text-transform:uppercase}
/* Section tabs */
.sec-tabs{display:flex;background:#0d0d0d;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.stab{flex:1;font-family:'Courier New',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:11px 4px;background:transparent;border:none;color:#555;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s}
.stab.active{color:#c9836a;border-bottom-color:#c9836a}
.tab-panel{display:none;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.tab-panel.active{display:block}
/* Cards inside detail */
.done-banner{background:rgba(125,186,132,0.1);border:1px solid #7dba84;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:#7dba84;font-weight:600}
.section-block{margin-bottom:20px}
.section-label{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1e1e1e}
.exercise-item{background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:11px 13px;margin-bottom:6px}
.ex-row{display:flex;justify-content:space-between;align-items:center}
.ex-name{font-size:13px;color:#faf5ee;font-weight:500}
.ex-detail{font-family:'Courier New',monospace;font-size:11px;color:#c9836a;flex-shrink:0;margin-left:8px}
.ex-video{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-family:'Courier New',monospace;font-size:10px;color:#c9836a;text-decoration:none;letter-spacing:1px;padding:4px 10px;border:1px solid rgba(201,131,106,0.3);border-radius:3px}
.ex-video:hover{background:rgba(201,131,106,0.1)}
/* Hard checklist */
.hard-checklist{margin-bottom:20px}
.hcl-title{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a;margin-bottom:10px}
.hcl-item{display:flex;align-items:center;gap:12px;background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:12px 14px;margin-bottom:6px;cursor:pointer;user-select:none;transition:border-color 0.15s}
.hcl-item:active{opacity:0.75}
.hcl-item.checked{border-color:#7dba84}
.hcl-item.checked .hcl-box{background:#7dba84;border-color:#7dba84;color:#fff}
.hcl-box{width:20px;height:20px;border-radius:4px;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:transparent;transition:all 0.2s}
.hcl-text{font-size:13px;color:#faf5ee;line-height:1.3}
/* Meal plan */
.meal-card{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:14px;margin-bottom:10px}
.meal-time{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a;margin-bottom:6px}
.meal-name{font-size:14px;font-weight:600;color:#faf5ee;margin-bottom:4px}
.meal-desc{font-size:12px;color:#777;line-height:1.5}
.meal-macros{display:flex;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid #2a2a2a}
.macro{text-align:center}
.macro-val{font-weight:700;font-size:14px;color:#faf5ee}
.macro-lbl{font-family:'Courier New',monospace;font-size:9px;color:#555;letter-spacing:1px;text-transform:uppercase}
.macro-total{background:rgba(201,131,106,0.08);border:1px solid rgba(201,131,106,0.2);border-radius:6px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.macro-total-label{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a}
.macro-total-vals{display:flex;gap:16px}
/* Notes / tips */
.tip-box{background:#141414;border-left:3px solid #c9836a;border-radius:0 6px 6px 0;padding:12px 16px;margin-bottom:16px}
.tip-title{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a;margin-bottom:8px}
.tip-item{font-size:12px;color:#aaa;padding:3px 0 3px 14px;position:relative;line-height:1.4}
.tip-item::before{content:'→';position:absolute;left:0;color:#c9836a;font-family:'Courier New',monospace}
/* Complete btn */
.complete-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:#c9836a;color:#0d0d0d;border:none;border-radius:8px;font-weight:900;font-size:18px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:all 0.2s}
.complete-btn:active{transform:scale(0.98);opacity:0.9}
.complete-btn.done-state{background:#1a2e1c;color:#7dba84}
/* STATS */
#stats{background:#0d0d0d;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.stats-pad{padding:calc(env(safe-area-inset-top,0px)+48px) 20px 100px}
.stats-title{font-weight:900;font-size:48px;letter-spacing:-1px;margin-bottom:24px;border-bottom:1px solid #2a2a2a;padding-bottom:16px;color:#faf5ee}
.stat-card{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:20px;margin-bottom:12px}
.stat-card-label{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:8px}
.stat-card-val{font-weight:900;font-size:44px;color:#c9836a;line-height:1}
.stat-card-sub{font-size:12px;color:#555;margin-top:4px}
.cal-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:12px}
.cal-cell{aspect-ratio:1;border-radius:2px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;font-size:7px;color:#444}
.cal-cell.done{background:#7dba84;color:#fff}
/* BOTTOM NAV */
.bottom-nav{display:flex;background:#141414;border-top:1px solid #2a2a2a;padding:8px 0 calc(env(safe-area-inset-bottom,0px)+8px);flex-shrink:0;position:sticky;bottom:0;z-index:10}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:#444;cursor:pointer;padding:6px 0;font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;transition:color 0.15s}
.nav-btn.active{color:#c9836a}
.nav-icon{font-size:20px}
/* TOAST */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+80px);left:50%;transform:translateX(-50%) translateY(20px);background:#7dba84;color:#fff;padding:10px 20px;border-radius:20px;font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;opacity:0;pointer-events:none;z-index:999;white-space:nowrap;transition:all 0.3s;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* PHOTO TAB */
.photo-upload-area{background:#141414;border:2px dashed #2a2a2a;border-radius:12px;padding:32px 20px;text-align:center;margin-bottom:16px;cursor:pointer;transition:border-color 0.2s}
.photo-upload-area:active{border-color:#c9836a}
.photo-upload-icon{font-size:40px;margin-bottom:10px}
.photo-upload-label{font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:6px}
.photo-upload-sub{font-size:12px;color:#333}
.photo-preview{width:100%;border-radius:10px;margin-bottom:12px;display:block;object-fit:cover;max-height:340px}
.photo-date-label{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#c9836a;margin-bottom:8px}
.photo-note-input{width:100%;background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;color:#faf5ee;font-size:13px;font-family:-apple-system,sans-serif;resize:none;margin-bottom:12px;outline:none}
.photo-note-input:focus{border-color:#c9836a}
.photo-save-btn{width:100%;padding:13px;background:transparent;color:#c9836a;border:1px solid #c9836a;border-radius:8px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;margin-bottom:8px}
.photo-save-btn:active{background:rgba(201,131,106,0.1)}
.photo-gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.gallery-item{position:relative;border-radius:8px;overflow:hidden;background:#141414;border:1px solid #2a2a2a;cursor:pointer}
.gallery-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gallery-item-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.8));padding:6px 8px;font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;color:#c9836a;text-transform:uppercase}
.gallery-empty{text-align:center;padding:32px 20px;color:#333;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.progress-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.compare-slot{background:#141414;border:1px solid #2a2a2a;border-radius:8px;overflow:hidden;aspect-ratio:0.75}
.compare-slot img{width:100%;height:100%;object-fit:cover}
.compare-slot-label{padding:8px;font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;color:#555;text-transform:uppercase;text-align:center}
/* SHOPPING */
#shopping{background:#0d0d0d;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.shop-pad{padding:calc(env(safe-area-inset-top,0px)+48px) 20px 100px}
.shop-title{font-weight:900;font-size:40px;letter-spacing:-1px;margin-bottom:6px;color:#faf5ee}
.shop-sub{font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:24px}
.week-selector{display:flex;overflow-x:auto;scrollbar-width:none;gap:8px;margin-bottom:20px;padding-bottom:4px}
.week-selector::-webkit-scrollbar{display:none}
.week-pill{flex-shrink:0;font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border:1px solid #2a2a2a;border-radius:20px;background:transparent;color:#555;cursor:pointer;transition:all 0.15s}
.week-pill.active{background:rgba(201,131,106,0.1);border-color:#c9836a;color:#c9836a}
.shop-category{margin-bottom:20px}
.shop-cat-title{font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#c9836a;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #2a2a2a}
.shop-item{display:flex;align-items:center;gap:12px;background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:11px 14px;margin-bottom:6px;cursor:pointer;user-select:none;transition:all 0.15s}
.shop-item:active{opacity:0.75}
.shop-item.got{opacity:0.45}
.shop-item.got .shop-check{background:#7dba84;border-color:#7dba84;color:#fff}
.shop-check{width:20px;height:20px;border-radius:4px;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:transparent;transition:all 0.2s}
.shop-name{font-size:13px;color:#faf5ee;flex:1}
.shop-qty{font-family:'Courier New',monospace;font-size:11px;color:#555;flex-shrink:0}
.shop-reset-btn{width:100%;padding:12px;background:transparent;color:#444;border:1px solid #2a2a2a;border-radius:8px;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:8px}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<!-- HOME -->

<div class="screen active" id="home">
  <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0d0d0d">
    <div class="home-hero">
      <div class="hero-badge">✦ 90-Day Sculpt Protocol</div>
      <div class="hero-title">SCULPT<br><span>&amp;</span><br>DEFINE</div>
      <div class="hero-sub">Glutes · Abs · Total Body Definition</div>
      <div class="progress-row">
        <div class="ring-wrap">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="34" fill="none" stroke="#2a2a2a" stroke-width="7"/>
            <circle id="ringCircle" cx="40" cy="40" r="34" fill="none" stroke="#c9836a" stroke-width="7"
              stroke-dasharray="213.6" stroke-dashoffset="213.6" stroke-linecap="round"/>
          </svg>
          <div class="ring-center">
            <div class="ring-pct" id="ringPct">0%</div>
            <div class="ring-lbl">done</div>
          </div>
        </div>
        <div class="progress-meta">
          <div class="prog-line"><span class="prog-key">Completed</span><span class="prog-val" id="doneCount">0/90</span></div>
          <div class="prog-line"><span class="prog-key">Streak</span><span class="prog-val" id="streakCount">0🔥</span></div>
          <div class="prog-line"><span class="prog-key">Phase</span><span class="prog-val" id="currentPhase">RAMP</span></div>
        </div>
      </div>
    </div>
    <div class="phase-tabs" id="phaseTabs">
      <button class="ptab active" data-phase="0" onclick="switchPhase(0)">Phase 1 — Ramp</button>
      <button class="ptab" data-phase="1" onclick="switchPhase(1)">Phase 2A — 75 Hard</button>
      <button class="ptab" data-phase="2" onclick="switchPhase(2)">Phase 2B — 75 Hard</button>
    </div>
    <div class="phase-content" id="phaseContent"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="showScreen('home',this)"><span class="nav-icon">🌸</span>Plan</button>
    <button class="nav-btn" onclick="showScreen('shopping',this)"><span class="nav-icon">🛒</span>Shop</button>
    <button class="nav-btn" onclick="showScreen('stats',this)"><span class="nav-icon">📊</span>Stats</button>
  </div>
</div>

<!-- DETAIL -->

<div class="screen" id="detail">
  <div class="detail-header">
    <button class="back-btn" onclick="goBack()">‹ Back</button>
    <div class="detail-day-num" id="detailDayNum">D1</div>
    <div class="detail-title-col">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-phase-lbl" id="detailPhase"></div>
    </div>
  </div>
  <div class="sec-tabs">
    <button class="stab active" onclick="switchTab('workout',this)">💪 Workout</button>
    <button class="stab" onclick="switchTab('meal',this)">🥗 Meals</button>
    <button class="stab" onclick="switchTab('checklist',this)">✅ Check-In</button>
    <button class="stab" onclick="switchTab('photo',this)">📸 Photo</button>
  </div>
  <div id="panel-workout" class="tab-panel active"></div>
  <div id="panel-meal" class="tab-panel"></div>
  <div id="panel-checklist" class="tab-panel"></div>
  <div id="panel-photo" class="tab-panel"></div>
</div>

<!-- SHOPPING -->

<div class="screen" id="shopping">
  <div class="shop-pad" style="flex:1">
    <div class="shop-title">Shopping List</div>
    <div class="shop-sub">Weekly grocery guide</div>
    <div class="week-selector" id="weekSelector"></div>
    <div id="shopContent"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="showScreen('home',this)"><span class="nav-icon">🌸</span>Plan</button>
    <button class="nav-btn active" onclick="showScreen('shopping',this)"><span class="nav-icon">🛒</span>Shop</button>
    <button class="nav-btn" onclick="showScreen('stats',this)"><span class="nav-icon">📊</span>Stats</button>
  </div>
</div>

<!-- STATS -->

<div class="screen" id="stats">
  <div class="stats-pad" style="flex:1">
    <div class="stats-title">Progress</div>
    <div id="statsContent"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="showScreen('home',this)"><span class="nav-icon">🌸</span>Plan</button>
    <button class="nav-btn" onclick="showScreen('shopping',this)"><span class="nav-icon">🛒</span>Shop</button>
    <button class="nav-btn active" onclick="showScreen('stats',this)"><span class="nav-icon">📊</span>Stats</button>
  </div>
</div>

<div class="toast" id="toast"></div>

function renderPhase(idx){
  currentPhaseTab=idx;
  const content=document.getElementById('phaseContent');
  content.innerHTML='';
  let days,weeks;
  if(idx===0){days=PHASE1;weeks=[{l:'Week 1 — Days 1–7',s:0,e:7},{l:'Week 2 — Days 8–15',s:7,e:15}];}
  else if(idx===1){days=PHASE2A;weeks=[{l:'Days 16–22',s:0,e:7},{l:'Days 23–29',s:7,e:14},{l:'Days 30–36',s:14,e:21},{l:'Days 37–45',s:21,e:30}];}
  else{days=PHASE2B;weeks=[{l:'Days 46–52',s:0,e:7},{l:'Days 53–59',s:7,e:14},{l:'Days 60–66',s:14,e:21},{l:'Days 67–73',s:21,e:28},{l:'Days 74–82',s:28,e:37},{l:'Days 83–90 — FINAL PUSH',s:37,e:45}];}
  weeks.forEach(w=>{
    const wh=document.createElement('div');wh.className='week-header';wh.textContent=w.l;content.appendChild(wh);
    days.slice(w.s,w.e).forEach(d=>{
      const gi=ALL_DAYS.findIndex(x=>x.day===d.day),done=!!completedDays[d.day];
      const row=document.createElement('div');row.className='day-row'+(done?' done':'');row.onclick=()=>openDay(gi);
      row.innerHTML=`<div class="check-col"><div class="check-circle">${done?'✓':''}</div></div>
        <div class="day-info"><div class="day-num">DAY ${d.day}</div>
        <div class="day-title">${d.title}</div>
        <div class="day-sub">${d.focus||d.phase}${d.outdoor?' · 🌿 Outdoor':''}</div></div>
        <div class="arrow-col">›</div>`;
      content.appendChild(row);
    });
  });
}
function switchPhase(idx){

}

function toggleCheck(day,itemKey,el){
  const k='day_'+day;
  if(!hardChecks[k]) hardChecks[k]={};
  hardChecks[k][itemKey]=!hardChecks[k][itemKey];
  save();
  el.classList.toggle('checked',hardChecks[k][itemKey]);
  const box=el.querySelector('.hcl-box');
  box.textContent=hardChecks[k][itemKey]?'✓':'';
  box.style.color=hardChecks[k][itemKey]?'#fff':'transparent';
  const allItems=day>=16?HARD_ITEMS:[{key:'w1'},{key:'water'},{key:'diet'},{key:'photo'}];
  if(allItems.every(i=>hardChecks[k][i.key])&&!completedDays[day]){
    completedDays[day]=true;save();
    ['completeBtn','completeBtnCL'].forEach(id=>{const b=document.getElementById(id);if(b){b.textContent='✓ DAY COMPLETE';b.classList.add('done-state');}});
    showToast('✨ All tasks done — Day '+day+' complete!');
    updateProgress();
  }
}

function toggleComplete(day){
  completedDays[day]=!completedDays[day];save();
  const done=completedDays[day];
  ['completeBtn','completeBtnCL'].forEach(id=>{const b=document.getElementById(id);if(b){b.textContent=done?'✓ DAY COMPLETE':'✓ MARK DAY COMPLETE';b.classList.toggle('done-state',done);}});
  if(done) showToast('✨ Day '+day+' marked complete!');
  updateProgress();
}

// ── PROGRESS ──────────────────────────────────────────────────
function updateProgress(){
  const done=Object.keys(completedDays).filter(k=>completedDays[k]).length;
  const pct=Math.round((done/90)*100);
  document.getElementById('doneCount').textContent=done+'/90';
  document.getElementById('ringPct').textContent=pct+'%';
  document.getElementById('ringCircle').style.strokeDashoffset=213.6-(pct/100)*213.6;
  let streak=0;for(let i=1;i<=90;i++){if(completedDays[i])streak++;else break;}
  document.getElementById('streakCount').textContent=streak+'🔥';
  document.getElementById('currentPhase').textContent=done<15?'RAMP':done<45?'75H-2A':'75H-2B';
  renderStats(done,streak,pct);
}

function renderStats(done,streak,pct){
  const sc=document.getElementById('statsContent');if(!sc)return;
  let html=`<div class="stat-card"><div class="stat-card-label">Days Completed</div><div class="stat-card-val">${done}</div><div class="stat-card-sub">${90-done} days remaining</div></div>`;
  html+=`<div class="stat-card"><div class="stat-card-label">Streak</div><div class="stat-card-val">${streak} 🔥</div><div class="stat-card-sub">Consecutive days from Day 1</div></div>`;
  html+=`<div class="stat-card"><div class="stat-card-label">Completion</div><div class="stat-card-val">${pct}%</div><div style="background:#2a2a2a;border-radius:4px;height:6px;margin-top:12px;overflow:hidden"><div style="background:#c9836a;height:6px;width:${pct}%;border-radius:4px"></div></div></div>`;
  html+=`<div class="stat-card"><div class="stat-card-label">Goal Focus</div><div class="stat-card-val" style="font-size:22px;line-height:1.4">Glutes<br>Abs<br>Definition</div><div class="stat-card-sub" style="margin-top:8px">Target: 130g+ protein/day · 1,800–2,000 cal/day</div></div>`;
  html+=`<div class="stat-card"><div class="stat-card-label">90-Day Grid</div><div class="cal-grid" id="calGrid"></div></div>`;
  sc.innerHTML=html;
  const grid=document.getElementById('calGrid');
  for(let i=1;i<=90;i++){const c=document.createElement('div');c.className='cal-cell'+(completedDays[i]?' done':'');c.textContent=i;grid.appendChild(c);}
}

// Generate 13 weeks cycling through the 3 templates
const ALL_SHOPPING=[];
for(let w=0;w<13;w++){
const base=WEEKLY_SHOPPING[w%3];
const startDay=w*7+1,endDay=Math.min(startDay+6,90);
ALL_SHOPPING.push({…base,week:`Week ${w+1}`,days:`Days ${startDay}–${endDay}`});
}

let currentShopWeek=0;

function renderShopping(weekIdx){
currentShopWeek=weekIdx;
const sel=document.getElementById(‘weekSelector’);
if(!sel) return;
sel.innerHTML=’’;
ALL_SHOPPING.forEach((w,i)=>{
const btn=document.createElement(‘button’);
btn.className=‘week-pill’+(i===weekIdx?’ active’:’’);
btn.textContent=w.week;
btn.onclick=()=>{document.querySelectorAll(’.week-pill’).forEach(p=>p.classList.remove(‘active’));btn.classList.add(‘active’);renderShopList(i);};
sel.appendChild(btn);
});
renderShopList(weekIdx);
}

function renderShopList(weekIdx){
const w=ALL_SHOPPING[weekIdx];
const content=document.getElementById(‘shopContent’);
if(!content) return;
const weekKey=‘shop_w’+weekIdx;
const checked=shoppingChecked[weekKey]||{};
let html=`<div style="font-family:'Courier New',monospace;font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-bottom:16px">${w.days}</div>`;
w.categories.forEach((cat,ci)=>{
html+=`<div class="shop-category"><div class="shop-cat-title">${cat.cat}</div>`;
cat.items.forEach((item,ii)=>{
const key=`${ci}_${ii}`,got=!!checked[key];
html+=`<div class="shop-item${got?' got':''}" onclick="toggleShopItem(${weekIdx},${ci},${ii},this)"> <div class="shop-check">${got?'✓':''}</div> <span class="shop-name">${item.n}</span> <span class="shop-qty">${item.q}</span></div>`;
});
html+=`</div>`;
});
const total=w.categories.reduce((s,c)=>s+c.items.length,0);
const gotCount=Object.values(checked).filter(Boolean).length;
html+=`<div style="font-family:'Courier New',monospace;font-size:11px;color:#555;letter-spacing:2px;text-align:center;margin:16px 0">${gotCount} / ${total} items checked</div>`;
html+=`<button class="shop-reset-btn" onclick="resetShopWeek(${weekIdx})">↺ Reset This Week's List</button>`;
html+=`<div style="height:40px"></div>`;
content.innerHTML=html;
}

function toggleShopItem(weekIdx,ci,ii,el){
const weekKey=‘shop_w’+weekIdx,key=`${ci}_${ii}`;
if(!shoppingChecked[weekKey]) shoppingChecked[weekKey]={};
shoppingChecked[weekKey][key]=!shoppingChecked[weekKey][key];
saveShop();
const got=shoppingChecked[weekKey][key];
el.classList.toggle(‘got’,got);
el.querySelector(’.shop-check’).textContent=got?‘✓’:’’;
}

function resetShopWeek(weekIdx){
shoppingChecked[‘shop_w’+weekIdx]={};
saveShop();
renderShopList(weekIdx);
showToast(‘List reset for this week.’);
}

// ── INIT ──────────────────────────────────────────────────────
renderPhase(0);
updateProgress();
// Don’t call renderShopping at init - render lazily when screen is shown
